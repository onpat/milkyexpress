version: '3.8'

services:
  backend:
    image: mcr.microsoft.com/devcontainers/javascript-node
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    ports:
      - "3000:3000" # for Express
    network_mode: service:frontend

  frontend:
    image: ://microsoft.com
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    ports:
      - "5173:5173" # for Vite